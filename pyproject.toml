[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentacion-cultivos-mx"
version = "0.1.0"
description = "Proyecto base para segmentación de imágenes de cultivos en México con modelos de IA."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
